<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FC6+6 TCSS — 全公司预测支持系统 DEMO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;--border:#30363d;
  --text:#e6edf3;--text2:#8b949e;
  --blue:#58a6ff;--green:#3fb950;--purple:#d2a8ff;
  --orange:#f0883e;--red:#ff7b72;--yellow:#e3b341;
  --sidebar:220px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ── Login ── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;z-index:999;
}
.login-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:40px 48px;width:400px;
}
.login-box h1{font-size:22px;font-weight:800;margin-bottom:4px;}
.login-box p{color:var(--text2);font-size:13px;margin-bottom:28px;}
.login-roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.role-btn{
  background:var(--bg3);border:1px solid var(--border);color:var(--text2);
  border-radius:8px;padding:12px;cursor:pointer;transition:.15s;text-align:left;
}
.role-btn:hover{border-color:var(--blue);color:var(--text);}
.role-btn.selected{border-color:var(--blue);background:#1f6feb22;color:var(--blue);}
.role-btn .role-name{font-weight:700;font-size:13px;}
.role-btn .role-email{font-size:11px;color:var(--text2);margin-top:2px;}
.login-btn{
  width:100%;padding:11px;background:var(--blue);color:#0d1117;
  border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;
  transition:.15s;
}
.login-btn:hover{background:#79c0ff;}

/* ── App shell ── */
#app{display:none;flex-direction:column;height:100vh;}

/* ── Top bar ── */
.topbar{
  height:52px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;
  position:sticky;top:0;z-index:100;
}
.topbar .logo{font-weight:800;font-size:15px;color:var(--blue);letter-spacing:.5px;}
.topbar .logo span{color:var(--text2);font-weight:400;}
.topbar .version-select{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:5px 10px;border-radius:6px;font-size:13px;cursor:pointer;
}
.topbar .spacer{flex:1;}
.topbar .user-badge{
  display:flex;align-items:center;gap:8px;font-size:13px;
}
.topbar .user-badge .avatar{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12px;
}
.topbar .logout-btn{
  background:none;border:1px solid var(--border);color:var(--text2);
  padding:4px 10px;border-radius:5px;cursor:pointer;font-size:12px;
}
.topbar .logout-btn:hover{color:var(--red);border-color:var(--red);}

/* ── Body ── */
.app-body{display:flex;flex:1;overflow:hidden;}

/* ── Sidebar ── */
.sidebar{
  width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);
  padding:12px 0;overflow-y:auto;flex-shrink:0;
}
.sidebar .nav-group{margin-bottom:4px;}
.sidebar .nav-label{
  font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.8px;
  text-transform:uppercase;padding:8px 16px 4px;
}
.sidebar .nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 16px;cursor:pointer;color:var(--text2);
  border-left:2px solid transparent;transition:.12s;font-size:13px;
}
.sidebar .nav-item:hover{background:var(--bg3);color:var(--text);}
.sidebar .nav-item.active{
  background:#1f6feb1a;color:var(--blue);border-left-color:var(--blue);
}
.sidebar .nav-item .icon{font-size:15px;width:18px;text-align:center;}

/* ── Content ── */
.content{flex:1;overflow-y:auto;padding:24px;}

/* ── Page header ── */
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.page-hd h2{font-size:18px;font-weight:700;}
.page-hd p{color:var(--text2);font-size:13px;margin-top:2px;}

/* ── Cards ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;
}
.kpi-card .kpi-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.kpi-card .kpi-value{font-size:24px;font-weight:800;margin:6px 0 2px;}
.kpi-card .kpi-change{font-size:12px;}
.kpi-card .kpi-change.up{color:var(--green);}
.kpi-card .kpi-change.down{color:var(--red);}

/* ── Chart grid ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}
.chart-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;
}
.chart-card h3{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;}
.chart-card canvas{max-height:220px;}

/* ── Table ── */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.table-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.table-toolbar h3{font-size:14px;font-weight:600;}
.btn{
  padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;
  border:1px solid;transition:.12s;font-weight:500;
}
.btn-primary{background:var(--blue);color:#0d1117;border-color:var(--blue);}
.btn-primary:hover{background:#79c0ff;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-ghost{background:none;color:var(--text2);border-color:var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text2);}
.btn-danger{background:none;color:var(--red);border-color:var(--red);}
table{width:100%;border-collapse:collapse;}
th{
  background:var(--bg3);padding:10px 14px;text-align:left;
  font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);
}
td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}

/* ── Badge ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;
}
.badge-draft{background:#30363d;color:var(--text2);}
.badge-submitted{background:#1f6feb22;color:var(--blue);border:1px solid var(--blue);}
.badge-finance{background:#d2a8ff22;color:var(--purple);border:1px solid var(--purple);}
.badge-ceo{background:#e3b34122;color:var(--yellow);border:1px solid var(--yellow);}
.badge-locked{background:#3fb95022;color:var(--green);border:1px solid var(--green);}
.badge-alert-red{background:#ff7b7222;color:var(--red);}
.badge-alert-yellow{background:#e3b34122;color:var(--yellow);}
.badge-alert-green{background:#3fb95022;color:var(--green);}

/* ── Approval flow ── */
.approval-flow{
  display:flex;align-items:center;gap:0;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:20px 24px;margin-bottom:16px;overflow-x:auto;
}
.flow-step{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  min-width:100px;
}
.flow-step .circle{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;border:2px solid var(--border);color:var(--text2);
  background:var(--bg3);
}
.flow-step.done .circle{background:#3fb95022;border-color:var(--green);color:var(--green);}
.flow-step.active .circle{background:#1f6feb22;border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px #1f6feb33;}
.flow-step .step-label{font-size:11px;color:var(--text2);text-align:center;}
.flow-step.done .step-label{color:var(--green);}
.flow-step.active .step-label{color:var(--blue);font-weight:700;}
.flow-arrow{color:var(--border);padding:0 8px;font-size:18px;margin-bottom:18px;}

/* ── Action buttons ── */
.action-row{
  display:flex;gap:10px;flex-wrap:wrap;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:16px;
}

/* ── Toast ── */
#toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;padding:12px 18px;font-size:13px;
  transform:translateY(80px);opacity:0;transition:.25s;z-index:9999;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px #00000066;
}
#toast.show{transform:translateY(0);opacity:1;}

/* ── Modal ── */
#modal-overlay{
  position:fixed;inset:0;background:#00000088;
  display:none;align-items:center;justify-content:center;z-index:500;
}
#modal-overlay.open{display:flex;}
.modal{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;padding:28px;width:460px;max-width:90vw;
}
.modal h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal .form-group{margin-bottom:14px;}
.modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:600;}
.modal input,.modal select,.modal textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;
}
.modal input:focus,.modal select:focus,.modal textarea:focus{
  outline:none;border-color:var(--blue);
}
.modal .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* ── Empty state ── */
.empty{text-align:center;padding:48px;color:var(--text2);}
.empty .icon{font-size:40px;margin-bottom:12px;}
.empty p{font-size:14px;}

/* ── KPI alert list ── */
.alert-list{display:flex;flex-direction:column;gap:8px;}
.alert-item{
  display:flex;align-items:center;gap:12px;
  background:var(--bg3);border-radius:7px;padding:10px 14px;
}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.alert-item .al-label{font-size:13px;flex:1;}
.alert-item .al-val{font-size:12px;color:var(--text2);}

/* ── Responsive ── */
@media(max-width:768px){
  .kpi-row{grid-template-columns:1fr 1fr;}
  .chart-grid{grid-template-columns:1fr;}
  .sidebar{display:none;}
}
</style>
</head>
<body>

<!-- ══════════════ LOGIN ══════════════ -->
<div id="login-screen">
  <div class="login-box">

</div>

<!-- Modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box"></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────
let user = null
let currentVersion = 'v1'
let charts = {}

  v2: [

// ── Auth ───────────────────────────────────────────────
function selectRole(el, email, name, role, color) {
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('selected'))

  window._loginData = { email, name, role, color }
}
window._loginData = { email:'business@tcss.com', name:'王业务', role:'BUSINESS', color:'#3fb950' }

  const d = window._loginData
  user = { email: d.email, name: d.name, role: d.role, color: d.color }
  document.getElementById('login-screen').style.display='none'
  document.getElementById('app').style.display='flex'
  document.getElementById('user-name').textContent = user.name
  document.getElementById('role-tag').textContent = user.role
  document.getElementById('user-avatar').textContent = user.name[0]
  document.getElementById('user-avatar').style.background = user.color+'33'
  document.getElementById('user-avatar').style.color = user.color
  nav('dashboard', document.querySelector('.nav-item'))
  toast('🎉 欢迎回来，' + user.name + '！角色：' + user.role)
}

function logout() {
  document.getElementById('login-screen').style.display='flex'
  document.getElementById('app').style.display='none'
  Object.values(charts).forEach(c=>c.destroy())
  charts={}
}

function selectVersion(v) { currentVersion=v; renderCurrentPage() }

// ── Navigation ────────────────────────────────────────
let currentPage = 'dashboard'
function nav(page, el) {
  currentPage = page
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'))
  if(el) el.classList.add('active')
  renderPage(page)
}

function renderCurrentPage() { renderPage(currentPage) }

function renderPage(page) {
  Object.values(charts).forEach(c=>c.destroy()); charts={}
  const pages = {
    dashboard, versions, revenue, expenses, hc, capex, reports, kpi, approval
  }
  const fn = pages[page]
  if(fn) fn()
}

// ── Toast ─────────────────────────────────────────────
function toast(msg, type='info') {
  const t = document.getElementById('toast')
  const icons = {info:'ℹ️', success:'✅', error:'❌', warn:'⚠️'}
  t.innerHTML = (icons[type]||'ℹ️') + ' ' + msg
  t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'), 3000)
}

// ── Modal ─────────────────────────────────────────────
function openModal(html) {
  document.getElementById('modal-box').innerHTML = html
  document.getElementById('modal-overlay').classList.add('open')
}
function closeModal(e) {
  if(e.target.id==='modal-overlay') document.getElementById('modal-overlay').classList.remove('open')
}
function closeModalNow() { document.getElementById('modal-overlay').classList.remove('open') }

// ── Status helpers ─────────────────────────────────────
function statusBadge(s) {
  const map = {
    DRAFT:            ['badge-draft',    '草稿'],
    SUBMITTED:        ['badge-submitted','已提交'],
    FINANCE_REVIEWED: ['badge-finance',  '财务已复核'],
    CEO_APPROVED:     ['badge-ceo',      'CEO已审批'],
    LOCKED:           ['badge-locked',   '已锁定'],
  }
  const [cls,label] = map[s]||['badge-draft',s]
  return `<span class="badge ${cls}">${label}</span>`
}

function fmt(n) { return (n/10000).toFixed(1)+'万' }
function fmtPct(n) { return (n*100).toFixed(1)+'%' }

    </div>
  `
}

// ══════════════════════════════════════════════════════
// PAGE: Reports
// ══════════════════════════════════════════════════════
function reports() {
  const ebitData = BUS.slice(0,4).map((bu,i)=>{
    const rev = [3240+i*100, 820+i*20, 1540+i*80, 630+i*30][i]||1000
    const gm = rev * [0.62,0.71,0.55,0.68][i]
    const exp = EXPENSE_DATA.filter(e=>e.bu===bu).reduce((s,e)=>s+e.amount,0)
    const ebit = Math.round(gm - exp*8)
    return {bu, rev, gm:Math.round(gm), exp:exp*8, ebit}
  })

  document.getElementById('content').innerHTML = `
    <div class="page-hd">
      <div><h2>📈 EBIT 管理报表</h2><p>各 BU 利润中心 EBIT 汇总分析</p></div>
      <button class="btn btn-ghost" onclick="toast('Excel导出演示模式，请连接真实后端使用','warn')">⬇ 导出 Excel</button>
    </div>
    <div class="chart-grid">
      <div class="chart-card">
        <h3>各 BU EBIT 瀑布图</h3>
        <canvas id="ebitChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>毛利率雷达图（vs KPI基准）</h3>
        <canvas id="radarChart"></canvas>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-toolbar"><h3>EBIT 明细（单位：万元）</h3></div>
      <table>
        <thead><tr><th>BU</th><th>收入</th><th>毛利润</th><th>费用</th><th>EBIT</th><th>EBIT率</th><th>vs KPI</th></tr></thead>
        <tbody>
          ${ebitData.map(r=>`
            <tr>
              <td><strong>${r.bu}</strong></td>
              <td style="text-align:right">${(r.rev/10000).toFixed(1)}万</td>
              <td style="text-align:right">${(r.gm/10000).toFixed(1)}万</td>
              <td style="text-align:right">${(r.exp/10000).toFixed(1)}万</td>
              <td style="text-align:right;color:#3fb950"><strong>${(r.ebit/10000).toFixed(1)}万</strong></td>
              <td style="text-align:right">${fmtPct(r.ebit/r.rev)}</td>
              <td><span class="badge ${r.ebit/r.rev>0.2?'badge-alert-green':'badge-alert-yellow'}">${r.ebit/r.rev>0.2?'✓ 达标':'⚠ 偏低'}</span></td>
            </tr>
          `).join('')}
          <tr style="font-weight:700;background:var(--bg3)">
            <td>合计</td>
            <td style="text-align:right">${(ebitData.reduce((s,r)=>s+r.rev,0)/10000).toFixed(1)}万</td>
            <td style="text-align:right">${(ebitData.reduce((s,r)=>s+r.gm,0)/10000).toFixed(1)}万</td>
            <td style="text-align:right">${(ebitData.reduce((s,r)=>s+r.exp,0)/10000).toFixed(1)}万</td>
            <td style="text-align:right;color:#3fb950">${(ebitData.reduce((s,r)=>s+r.ebit,0)/10000).toFixed(1)}万</td>
            <td colspan="2"></td>
          </tr>
        </tbody>
      </table>
    </div>
  `

  // EBIT bar
  const ctx1 = document.getElementById('ebitChart').getContext('2d')
  charts.ebit = new Chart(ctx1, {
    type:'bar',
    data:{
      labels:ebitData.map(r=>r.bu),
      datasets:[
        {label:'收入', data:ebitData.map(r=>Math.round(r.rev/10000)),backgroundColor:'#58a6ff55'},
        {label:'毛利润',data:ebitData.map(r=>Math.round(r.gm/10000)), backgroundColor:'#d2a8ff55'},
        {label:'EBIT', data:ebitData.map(r=>Math.round(r.ebit/10000)),backgroundColor:'#3fb95099'},
      ]
    },
    options:{responsive:true,plugins:{legend:{labels:{color:'#8b949e'}}},
      scales:{x:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}},
              y:{ticks:{color:'#8b949e'},grid:{color:'#30363d'}}}}
  })

  // Radar
  const ctx2 = document.getElementById('radarChart').getContext('2d')
  charts.radar = new Chart(ctx2, {
    type:'radar',
    data:{
      labels:['国内人医','电商','国际公卫','宠物'],
      datasets:[
        {label:'实际毛利率',data:[62,71,55,68],borderColor:'#58a6ff',backgroundColor:'#58a6ff22',pointBackgroundColor:'#58a6ff'},
        {label:'KPI基准',  data:[62,70,58,65],borderColor:'#3fb950', backgroundColor:'#3fb95022',borderDash:[4,2]},

// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════
// PAGE: Approval
// ══════════════════════════════════════════════════════
function approval() {
  const ver = VERSIONS[currentVersion]
  const status = ver.status
  const history = APPROVAL_HISTORY[currentVersion] || []

  const steps = [
    {key:'DRAFT',         label:'草稿',     icon:'📝'},
    {key:'SUBMITTED',     label:'已提交',   icon:'📤'},
    {key:'FINANCE_REVIEWED',label:'财务复核',icon:'💼'},
    {key:'CEO_APPROVED',  label:'CEO审批',  icon:'👔'},
    {key:'LOCKED',        label:'已锁定',   icon:'🔒'},
  ]
  const statusOrder = steps.map(s=>s.key)
  const currentIdx = statusOrder.indexOf(status)

  const flowHtml = steps.map((s,i)=>`
    <div class="flow-step ${i<currentIdx?'done':i===currentIdx?'active':''}">
      <div class="circle">${i<currentIdx?'✓':s.icon}</div>
      <div class="step-label">${s.label}</div>
    </div>
    ${i<steps.length-1?'<div class="flow-arrow">→</div>':''}
  `).join('')

  // Available actions based on role and status
  const actions = []
  if(user.role==='BUSINESS'&&status==='DRAFT')
    actions.push({label:'📤 提交审批',action:'SUBMIT',color:'var(--blue)'})
  if(user.role==='FINANCE'&&status==='SUBMITTED')
    actions.push({label:'💼 财务复核通过',action:'FINANCE_REVIEW',color:'var(--purple)'})
  if((user.role==='CEO'||user.role==='ADMIN')&&status==='FINANCE_REVIEWED')
    actions.push({label:'👔 CEO 审批通过',action:'CEO_APPROVE',color:'var(--yellow)'})
  if((user.role==='CEO'||user.role==='ADMIN')&&status==='CEO_APPROVED')
    actions.push({label:'🔒 锁定版本',action:'LOCK',color:'var(--green)'})
  if((user.role==='FINANCE'||user.role==='CEO'||user.role==='ADMIN')&&['SUBMITTED','FINANCE_REVIEWED','CEO_APPROVED'].includes(status))
    actions.push({label:'↩ 驳回退回',action:'REJECT',color:'var(--red)'})

  const historyHtml = history.length === 0
    ? '<div class="empty"><div class="icon">📭</div><p>暂无审批记录</p></div>'
    : history.map(h=>`
      <tr>
        <td>${h.actor}</td>
        <td><span class="badge badge-submitted">${h.role}</span></td>
        <td>${h.action}</td>
        <td>${h.comment}</td>
        <td style="color:var(--text2)">${h.time}</td>
      </tr>
    `).join('')

  document.getElementById('content').innerHTML = `
    <div class="page-hd">
      <div><h2>✅ 审批工作流</h2><p>版本：${ver.name} · 当前状态：${statusBadge(status)}</p></div>
    </div>

    <div class="approval-flow">${flowHtml}</div>

    ${actions.length > 0 ? `
    <div class="action-row">
      <span style="color:var(--text2);font-size:13px;align-self:center">可执行操作（${user.role}）：</span>
      ${actions.map(a=>`
        <button class="btn" style="background:${a.color}22;border-color:${a.color};color:${a.color}"
          onclick="doApproval('${a.action}','${a.label}')">
          ${a.label}
        </button>
      `).join('')}
    </div>` : `
    <div class="action-row" style="color:var(--text2);font-size:13px">
      ℹ️ 当前状态下，${user.role} 角色无可执行操作
    </div>`}

    <div class="table-wrap">
      <div class="table-toolbar"><h3>审批历史</h3></div>
      <table>
        <thead><tr><th>操作人</th><th>角色</th><th>操作</th><th>备注</th><th>时间</th></tr></thead>
        <tbody>${historyHtml}</tbody>
      </table>
    </div>
  `
}

function doApproval(action, label) {
  const msgs = {
    SUBMIT: '提交审批',
    FINANCE_REVIEW: '财务复核通过',
    CEO_APPROVE: 'CEO 审批通过',
    LOCK: '版本已锁定',
    REJECT: '已驳回退回草稿'
  }
  const transitions = {
    SUBMIT:'SUBMITTED', FINANCE_REVIEW:'FINANCE_REVIEWED',
    CEO_APPROVE:'CEO_APPROVED', LOCK:'LOCKED', REJECT:'DRAFT'
  }
  openModal(`
    <h3>${label}</h3>
    <div class="form-group">
      <label>审批意见（可选）</label>
      <textarea id="ap-comment" rows="3" placeholder="请输入审批意见..."></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModalNow()">取消</button>
      <button class="btn btn-primary" onclick="confirmApproval('${action}','${msgs[action]}')">确认执行</button>
    </div>
  `)
}

function confirmApproval(action, msg) {
  const comment = document.getElementById('ap-comment')?.value || ''
  const transitions = {
    SUBMIT:'SUBMITTED', FINANCE_REVIEW:'FINANCE_REVIEWED',
    CEO_APPROVE:'CEO_APPROVED', LOCK:'LOCKED', REJECT:'DRAFT'
  }
  VERSIONS[currentVersion].status = transitions[action]
  const roleNames = {BUSINESS:'王业务',FINANCE:'李财务',CEO:'张总',ADMIN:'系统管理员'}
  if(!APPROVAL_HISTORY[currentVersion]) APPROVAL_HISTORY[currentVersion]=[]
  APPROVAL_HISTORY[currentVersion].push({
    actor:user.name, role:user.role, action,
    comment:comment||'—',
    time:new Date().toLocaleString('zh-CN',{hour12:false}).slice(0,-3)
  })
  closeModalNow()
  toast('✅ ' + msg, 'success')
  setTimeout(()=>approval(),300)
}
</script>
